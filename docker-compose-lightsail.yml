services:
  test-prep:
    image: iqesolutions/test-prep:latest
    container_name: test-prep
    restart: always
    volumes:
      - ./config.json:/app/config.json:ro
      - ./analytics.json:/app/analytics.json
    env_file:
      - .env
    networks:
      - edge-test-prep

networks:
  # This app's own edge network — only apps-home's Caddy joins it (see apps-home CLAUDE.md
  # "Network isolation"); not the shared iqe-proxy-net, where any other app could reach it.
  edge-test-prep:
    name: edge-test-prep
    external: true

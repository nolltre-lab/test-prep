<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<script>
// Same subpath detection as index.html: behind the proxy (/adventure/) /api/* must get the prefix.
(function(){
  var p = window.location.pathname;
  var base = p.endsWith('/') ? p.slice(0,-1) : p.replace(/\/[^/]*$/,'');
  if(!base) return;
  var _fetch = window.fetch;
  window.fetch = function(url,opts){
    if(typeof url==='string' && url.startsWith('/api/')) url = base+url;
    return _fetch.call(this,url,opts);
  };
})();
</script>
<meta name="theme-color" content="#7cc26b" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<title>Kunskapsäventyret</title>
<style>
:root{
  --ink:#2b2340; --paper:#fffaf0; --sun:#ffd447;
  --good:#3fbf6b; --bad:#ff7a6b; --accent:#ff8fb8; --accent2:#7b6cff; --shadow:rgba(43,35,64,.18);
  --radius:22px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family: "Trebuchet MS", "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
  color:var(--ink); background:#9edb7f; overflow:hidden;
  -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.screen{position:fixed;inset:0;display:none}
.screen.on{display:block}

/* ---------- Start screen ---------- */
#start{overflow:auto;background:linear-gradient(#bfe8ff 0%,#e3f6ff 40%,#9edb7f 40%,#7cc26b 100%)}
.start-wrap{max-width:760px;margin:0 auto;padding:24px 16px 60px}
.title{text-align:center;margin:8px 0 4px;font-size:clamp(30px,7vw,52px);letter-spacing:1px;
  color:#fff;text-shadow:0 3px 0 var(--accent2),0 6px 0 rgba(0,0,0,.12)}
.subtitle{text-align:center;margin:0 0 20px;font-size:18px}
.card{background:var(--paper);border-radius:var(--radius);padding:16px;margin:14px 0;box-shadow:0 6px 0 var(--shadow)}
.card h2{margin:0 0 10px;font-size:20px}
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.hero-btn{background:#fff;border-radius:18px;padding:6px 4px 2px;border:4px solid transparent;box-shadow:0 4px 0 var(--shadow)}
.hero-btn.sel{border-color:var(--accent2);background:#f1efff;transform:translateY(-3px)}
.hero-btn svg{width:74px;height:74px;display:block;margin:0 auto}
.hero-btn span{display:block;text-align:center;font-weight:bold;font-size:13px;padding:2px 0 4px}
.name-in{width:100%;padding:12px 14px;font:inherit;font-size:18px;border-radius:14px;border:3px solid #e6dcc8;background:#fff}
.groups{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.group-btn{background:#fff;border-radius:99px;padding:8px 16px;border:3px solid #eee3cf;font-size:16px;font-weight:bold}
.group-btn.sel{border-color:var(--accent2);background:var(--accent2);color:#fff}
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;max-height:340px;overflow:auto;padding:2px}
.subject{grid-column:1/-1;font-weight:bold;font-size:15px;opacity:.7;margin:6px 2px -2px}
.pack-btn{background:#fff;border-radius:14px;padding:10px 12px;text-align:left;border:3px solid #eee3cf;font-size:15px}
.pack-btn small{display:block;opacity:.6;margin-top:2px}
.pack-btn.sel{border-color:var(--accent2);background:#f1efff}
.pack-btn .badge{float:right;font-size:12px;background:var(--sun);border-radius:99px;padding:1px 8px}
.lengths{display:flex;gap:10px;flex-wrap:wrap}
.len-btn{flex:1;min-width:120px;background:#fff;border-radius:14px;padding:10px;border:3px solid #eee3cf;font-size:16px}
.len-btn.sel{border-color:var(--accent2);background:#f1efff}
#themes .len-btn{min-width:110px;flex:1 1 110px}
.theme-now{margin:10px 2px 0;font-size:15px;opacity:.75}
.big-btn{display:block;width:100%;padding:16px;font-size:22px;font-weight:bold;color:#fff;border-radius:18px;
  background:var(--accent2);box-shadow:0 6px 0 #5446c9;margin-top:10px}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #5446c9}
.big-btn:disabled{opacity:.5}
.big-btn.alt{background:var(--good);box-shadow:0 6px 0 #2a9150}

/* ---------- Scene ---------- */
#play{background:#000}
#world{position:absolute;inset:0;overflow:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#world::-webkit-scrollbar{display:none}
#scene{display:block}
.hud{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;
  padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));pointer-events:none;z-index:5}
.hud>*{pointer-events:auto}
.hud .grow{flex:1}
.pill{background:var(--paper);border-radius:99px;padding:7px 14px;font-weight:bold;box-shadow:0 4px 0 var(--shadow);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hud .pill#starCount{flex:0 0 auto}
.timer{height:10px;background:#eee3cf;border-radius:99px;overflow:hidden;margin:2px 0 10px}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffd447,#ff8fb8);border-radius:99px}
.write-box{display:none;margin-top:6px}
.write-box textarea{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:16px;border:3px solid #eee3cf;background:#fff;resize:vertical;user-select:text;-webkit-user-select:text}
.write-box .big-btn{margin-top:8px}
.score-line{display:block;margin-top:6px;font-weight:bold;color:#b06a00}
@media(max-width:520px){.hud .place{display:none}}
.icon-btn{background:var(--paper);border-radius:99px;width:44px;height:44px;flex:0 0 44px;font-size:21px;box-shadow:0 4px 0 var(--shadow)}
#wx{position:fixed;inset:0;pointer-events:none;z-index:4;display:none}
#fog{position:fixed;inset:0;pointer-events:none;z-index:4;display:none;background:linear-gradient(180deg,rgba(255,255,255,0) 30%,rgba(235,240,245,.22) 65%,rgba(235,240,245,.38));animation:fog 9s ease-in-out infinite alternate}
@keyframes fog{from{opacity:.7}to{opacity:1}}
#fade{position:fixed;inset:0;background:#fffaf0;opacity:0;pointer-events:none;transition:opacity .45s;z-index:8}
#fade.on{opacity:1;pointer-events:auto}
#banner{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%);background:var(--paper);border-radius:24px;padding:16px 26px;
  text-align:center;box-shadow:0 8px 0 var(--shadow);z-index:7;pointer-events:none;opacity:0;width:max-content;max-width:90vw}
#banner.on{animation:banner 3.2s ease forwards}
#banner b{display:block;font-size:28px;color:var(--accent2)}
#banner span{font-size:18px}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}12%,80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%)}}

/* things inside the scene SVG */
.spot{cursor:pointer}
.peeker{transform:translateY(var(--hide,0px));transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.peeker.hiding{animation:peekaboo 10s ease-in-out infinite}
.peeker.hiding.easy{animation-name:peekaboo-easy}
.peeker.peek-now{animation:none;transform:translateY(var(--pk))}
@keyframes peekaboo{0%,76%,100%{transform:translateY(var(--hide,0px))}82%,90%{transform:translateY(var(--pk))}}
@keyframes peekaboo-easy{0%,56%,100%{transform:translateY(var(--hide,0px))}64%,84%{transform:translateY(var(--pk))}}
.peeker.out{animation:none;transform:translateY(var(--out))}
.front.wiggle{animation:wiggle .5s!important}
.rustle{animation:rustle 8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes rustle{0%,86%,100%{transform:rotate(0)}88%{transform:rotate(-4deg)}90%{transform:rotate(4deg)}92%{transform:rotate(-3deg)}94%{transform:rotate(2deg)}}
.glint{opacity:0;animation:glint 8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes glint{0%,78%,100%{opacity:0;transform:scaleY(1)}81%,92%{opacity:1;transform:scaleY(1)}86%{opacity:1;transform:scaleY(.1)}}
.wiggle{animation:wiggle .5s;transform-box:fill-box;transform-origin:50% 100%}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.bob{animation:bob 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.ripple{animation:ripple 2.4s ease-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes ripple{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.bubble-up{animation:bubbleUp 3s ease-in infinite}
@keyframes bubbleUp{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-46px);opacity:0}}
.sparkle{animation:sparkle .9s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes sparkle{0%,100%{transform:scale(.6) rotate(0);opacity:.4}50%{transform:scale(1.25) rotate(45deg);opacity:1}}
.flutter{animation:flutter 7s ease-in-out infinite}
@keyframes flutter{0%{transform:translate(0,0)}25%{transform:translate(60px,-30px)}50%{transform:translate(120px,10px)}75%{transform:translate(50px,30px)}100%{transform:translate(0,0)}}
.sway{animation:sway 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}

/* ---------- Question dialog ---------- */
#dlg{position:fixed;inset:0;background:rgba(43,35,64,.45);display:none;align-items:flex-end;justify-content:center;z-index:10;padding:12px}
#dlg.on{display:flex}
@media(min-height:640px){#dlg{align-items:center}}
.dlg-box{width:100%;max-width:560px;background:var(--paper);border-radius:28px;padding:16px;box-shadow:0 10px 0 var(--shadow);
  animation:pop .25s ease-out;max-height:calc(100vh - 24px);overflow:auto}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.talker{display:flex;gap:12px;align-items:flex-end}
.talker .who{flex:0 0 110px}
.talker .who svg{width:110px;height:110px;display:block}
.bubble{position:relative;flex:1;background:#fff;border-radius:20px;padding:14px 16px;font-size:clamp(17px,2.6vw,21px);line-height:1.35;
  border:3px solid #eee3cf;margin-bottom:18px}
.bubble:after{content:"";position:absolute;left:-14px;bottom:18px;border:10px solid transparent;border-right:14px solid #fff;border-left:0}
.bubble .name{display:block;font-size:13px;font-weight:bold;opacity:.6;margin-bottom:4px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media(max-width:420px){.answers{grid-template-columns:1fr}}
.ans{background:#fff;border-radius:16px;padding:14px 12px;font-size:18px;border:3px solid #eee3cf;box-shadow:0 4px 0 var(--shadow);text-align:left}
.ans .k{display:inline-block;width:28px;height:28px;line-height:28px;text-align:center;border-radius:50%;background:var(--sun);font-weight:bold;margin-right:8px;font-size:15px}
.ans:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.ans.right{background:#dcf7e5;border-color:var(--good)}
.ans.wrong{background:#ffe3df;border-color:var(--bad);animation:shake .35s}
.ans:disabled{cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.dlg-foot{display:flex;gap:10px;margin-top:12px;align-items:center}
.dlg-foot .grow{flex:1}
.small-btn{background:#fff;border-radius:14px;padding:10px 14px;border:3px solid #eee3cf;font-size:15px}
.feedback{margin-top:10px;font-size:17px;border-radius:14px;padding:10px 12px;display:none}
.feedback.on{display:block}
.feedback.good{background:#dcf7e5}
.feedback.bad{background:#ffe3df}
.feedback.hint{background:#fff6c9}
.hearts{font-size:20px;letter-spacing:2px}

/* ---------- Floating effects ---------- */
.float{position:fixed;pointer-events:none;font-size:30px;font-weight:bold;z-index:20;animation:floatUp 1.8s ease-out forwards;
  text-shadow:0 2px 0 #fff,0 0 6px #fff;max-width:80vw;text-align:center}
@keyframes floatUp{from{transform:translate(-50%,0) scale(.6);opacity:0}15%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}70%{opacity:1}to{transform:translate(-50%,-80px) scale(1);opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}

/* ---------- Finish screen ---------- */
#finish{background:radial-gradient(circle at 50% 30%,#fff6c9,#ffd447 45%,#ff9fc4);overflow:auto}
.finish-wrap{max-width:560px;margin:0 auto;padding:30px 16px;text-align:center}
.stars-big{font-size:46px;letter-spacing:4px;margin:6px 0}
</style>
</head>
<body>

<!-- ================= START ================= -->
<section id="start" class="screen on">
  <div class="start-wrap">
    <h1 class="title">Kunskapsäventyret</h1>
    <p class="subtitle">Djuren har gömt sig! Leta upp dem, svara på deras frågor och ta dig hela vägen till drakens slott.</p>

    <div class="card">
      <h2>1. Välj din hjälte</h2>
      <div class="heroes" id="heroes"></div>
      <div style="margin-top:12px"><input id="heroName" class="name-in" maxlength="16" placeholder="Vad heter du?" /></div>
    </div>

    <div class="card">
      <h2>2. Välj årskurs och vad du vill öva på</h2>
      <div class="groups" id="groups"></div>
      <div class="packs" id="packs"><div>Laddar…</div></div>
    </div>

    <div class="card">
      <h2>3. Hur långt äventyr?</h2>
      <div class="lengths" id="lengths"></div>
    </div>

    <div class="card">
      <h2>4. Välj tema</h2>
      <div class="lengths" id="themes"></div>
      <p class="theme-now" id="themeNow"></p>
    </div>

    <button class="big-btn alt" id="continueBtn" style="display:none">Fortsätt äventyret</button>
    <button class="big-btn" id="goBtn" disabled>Starta äventyret!</button>
  </div>
</section>

<!-- ================= PLAY ================= -->
<section id="play" class="screen">
  <div id="world"></div>
  <div class="hud">
    <button class="icon-btn" id="homeBtn" title="Till start">🏠</button>
    <span class="pill" id="where"></span>
    <span class="grow"></span>
    <span class="pill" id="starCount">🏆 0</span>
    <button class="icon-btn" id="hintSpotBtn" title="Var gömmer de sig? (kostar 10 poäng)">🔍</button>
    <button class="icon-btn" id="soundBtn" title="Ljud">🔊</button>
  </div>
  <div id="banner"><b id="bannerTitle"></b><span id="bannerSub"></span></div>
</section>
<canvas id="wx"></canvas><div id="fog"></div>
<div id="fade"></div>

<!-- ================= QUESTION DIALOG ================= -->
<div id="dlg">
  <div class="dlg-box">
    <div class="talker">
      <div class="who" id="dlgWho"></div>
      <div class="bubble"><span class="name" id="dlgName"></span><span id="dlgQ"></span></div>
    </div>
    <div class="timer" id="dlgTimerBox" title="Svara snabbt för bonuspoäng"><i id="dlgTimer"></i></div>
    <div class="answers" id="dlgAns"></div>
    <div class="write-box" id="dlgWriteBox">
      <textarea id="dlgWrite" rows="4" placeholder="Skriv ditt svar här, med egna ord …"></textarea>
      <button class="big-btn" id="sendWriteBtn">Ge svaret till draken 🐉</button>
    </div>
    <div class="feedback" id="dlgFb"></div>
    <div class="dlg-foot">
      <span class="hearts" id="dlgHearts"></span>
      <span class="grow"></span>
      <button class="small-btn" id="hintBtn">💡 Ledtråd</button>
      <button class="small-btn" id="closeBtn">Senare</button>
      <button class="big-btn alt" id="nextBtn" style="display:none;width:auto;margin:0;padding:10px 18px;font-size:18px">Vidare →</button>
    </div>
  </div>
</div>

<!-- ================= FINISH ================= -->
<section id="finish" class="screen">
  <div class="finish-wrap">
    <h1 class="title" style="text-shadow:0 3px 0 #ff6fa3">Du klarade det!</h1>
    <div id="finishArt"></div>
    <div class="stars-big" id="finishStars"></div>
    <p id="finishText" style="font-size:19px"></p>
    <button class="big-btn" id="againBtn">Nytt äventyr</button>
  </div>
</section>

<canvas id="confetti"></canvas>

<script>
"use strict";
/* =====================================================================
   Characters — inline SVG in a 100×100 box, so the same drawing works
   small in the scene and big in the question dialog.
   mood: "idle" | "happy" | "sad"
   ===================================================================== */
const INK = "#2b2340";
const eyes = (x1, x2, y, mood, r = 5) => mood === "happy"
  ? `<path d="M${x1-r} ${y} q${r} -${r+2} ${2*r} 0 M${x2-r} ${y} q${r} -${r+2} ${2*r} 0" stroke="${INK}" stroke-width="3" fill="none" stroke-linecap="round"/>`
  : `<circle cx="${x1}" cy="${y}" r="${r}" fill="${INK}"/><circle cx="${x2}" cy="${y}" r="${r}" fill="${INK}"/>
     <circle cx="${x1+r*.32}" cy="${y-r*.36}" r="${r/2.6}" fill="#fff"/><circle cx="${x2+r*.32}" cy="${y-r*.36}" r="${r/2.6}" fill="#fff"/>`;
const mouth = (cx, y, mood, w = 8) => mood === "sad"
  ? `<path d="M${cx-w} ${y+4} q${w} -7 ${2*w} 0" stroke="${INK}" stroke-width="3" fill="none" stroke-linecap="round"/>`
  : `<path d="M${cx-w} ${y} q${w} ${mood==="happy"?10:6} ${2*w} 0" stroke="${INK}" stroke-width="3" fill="${mood==="happy"?"#ff7a8a":"none"}" stroke-linecap="round"/>`;
const cheeks = (x1, x2, y) => `<circle cx="${x1}" cy="${y}" r="4.5" fill="#ff9fb6" opacity=".7"/><circle cx="${x2}" cy="${y}" r="4.5" fill="#ff9fb6" opacity=".7"/>`;
const shadow = `<ellipse cx="50" cy="95" rx="30" ry="5" fill="#000" opacity=".12"/>`;

/* The animals that hide in the scenes and ask the questions. */
const CHARACTERS = {
  duck: { name: "Anki Anka", draw: m => `${shadow}
    <ellipse cx="54" cy="70" rx="32" ry="22" fill="#ffd93b"/>
    <path d="M78 62 q14 -6 12 8 q-6 4 -14 0z" fill="#ffd93b"/>
    <ellipse cx="50" cy="72" rx="14" ry="9" fill="#ffc400" transform="rotate(-15 50 72)"/>
    <circle cx="40" cy="38" r="21" fill="#ffd93b"/>
    <path d="M14 40 q8 -8 16 -2 q-6 8 -16 2z" fill="#ff9a2e"/>
    ${eyes(36, 48, 33, m, 4)}${cheeks(30, 52, 44)}
    <path d="M37 18 q4 -10 8 0" stroke="#ffc400" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M44 92 l-5 4 h10z M62 92 l-5 4 h10z" fill="#ff9a2e"/>` },

  frog: { name: "Fridolf Groda", draw: m => `${shadow}
    <ellipse cx="50" cy="70" rx="34" ry="24" fill="#5cc766"/>
    <ellipse cx="50" cy="76" rx="20" ry="14" fill="#c9f0a8"/>
    <circle cx="32" cy="40" r="14" fill="#5cc766"/><circle cx="68" cy="40" r="14" fill="#5cc766"/>
    <ellipse cx="50" cy="56" rx="30" ry="18" fill="#5cc766"/>
    <circle cx="32" cy="40" r="9" fill="#fff"/><circle cx="68" cy="40" r="9" fill="#fff"/>
    ${m==="happy" ? eyes(32, 68, 41, m, 5) : `<circle cx="33" cy="41" r="5" fill="${INK}"/><circle cx="69" cy="41" r="5" fill="${INK}"/>`}
    ${mouth(50, 60, m, 14)}${cheeks(30, 70, 60)}
    <path d="M22 88 q-8 6 -2 8 h14z M78 88 q8 6 2 8 h-14z" fill="#3fa94e"/>` },

  owl: { name: "Ugglan Ulla", draw: m => `${shadow}
    <path d="M22 30 L30 12 L42 26 Z M78 30 L70 12 L58 26 Z" fill="#9a6a45"/>
    <ellipse cx="50" cy="58" rx="32" ry="36" fill="#a9774f"/>
    <ellipse cx="50" cy="70" rx="20" ry="22" fill="#f1d8b4"/>
    <path d="M38 64 q4 4 8 0 M54 64 q4 4 8 0 M42 74 q4 4 8 0 M50 74 q4 4 8 0" stroke="#c9a57c" stroke-width="2" fill="none"/>
    <circle cx="37" cy="40" r="13" fill="#fff"/><circle cx="63" cy="40" r="13" fill="#fff"/>
    ${eyes(37, 63, 40, m, 6)}
    <path d="M46 50 l4 8 l4 -8z" fill="#ff9a2e"/>
    ${m==="sad" ? `<path d="M44 60 q6 -4 12 0" stroke="${INK}" stroke-width="2.5" fill="none"/>` : ""}
    <path d="M30 22 h40 l-4 -8 h-32z" fill="${INK}"/><rect x="40" y="6" width="20" height="10" fill="${INK}"/>
    <path d="M70 14 l8 10" stroke="#ffd447" stroke-width="3"/><circle cx="78" cy="25" r="3" fill="#ffd447"/>` },

  hedgehog: { name: "Igge Igelkott", draw: m => `${shadow}
    <path d="M14 78 L10 62 L20 58 L16 44 L28 44 L28 30 L40 36 L46 22 L54 34 L64 24 L66 38 L80 34 L76 48 L90 50 L82 62 L90 74 L80 80Z" fill="#6b4a33"/>
    <ellipse cx="54" cy="70" rx="30" ry="22" fill="#7d5a3f"/>
    <ellipse cx="34" cy="70" rx="20" ry="18" fill="#f3d6ae"/>

const hol = () => (game && HOLIDAYS[game.holiday]) || null;
const placeName = p => (hol() && hol().names[p]) || PLACES[p].name;
const bossShort = () => (hol() && hol().short) || "draken";
const hiderWord = n => { const w = hol() ? hol().hiderWord : ["djur", "djur"]; return n === 1 ? w[0] : w[1]; };
function hidersFor(kind, holiday) {
  const H = HOLIDAYS[holiday];
  if (!H) return SPOT_KINDS[kind].animals;
  return WATER_KINDS.includes(kind) ? H.water : H.hiders;
}

/* Points, the same rules as Test Prep Quiz: 10 per right answer, multiplied by the streak
   (3 in a row ×2, 5 in a row ×3), plus a speed bonus while the timer bar is still full. */
const BASE_POINTS = 10, HINT_COST = 10;
const streakMultiplier = streak => streak >= 5 ? 3 : streak >= 3 ? 2 : 1;
// Seconds for the full speed bonus to run out: longer questions get more reading time.
const speedWindow = q => clamp(10 + (q.q.length + q.choices.join("").length) / 14, 12, 30);
function speedBonus(ms, windowS) {
  const left = 1 - ms / (windowS * 1000);
  return left >= .75 ? 5 : left >= .5 ? 3 : left >= .25 ? 1 : 0;
}

const $ = s => document.querySelector(s);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
// Deterministic noise, so a scene's decorations look the same every time it is drawn.
const rnd = seed => { const x = Math.sin(seed * 9301 + 49297) * 233280; return x - Math.floor(x); };

/* =====================================================================

   ===================================================================== */
let actx = null;
function tone(freqs, dur = 0.12, type = "triangle", gap = 0.09) {
  if (!sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      const t = actx.currentTime + i * gap;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
    });
  } catch {}
}

/* =====================================================================
   Building a journey from a pack
   ===================================================================== */
// Turn pack items into multiple-choice questions. Items without choices get
// three wrong answers borrowed from other items' answers.
function toQuestions(items) {
  const backs = items.map(it => String(it.back ?? "").trim()).filter(Boolean);
  return items.map(it => {
    const q = String(it.front ?? "").trim();
    if (!q) return null;
    let choices, answer;
    if (Array.isArray(it.choices) && it.choices.length >= 2 && Number.isInteger(it.answerIndex) && it.choices[it.answerIndex] != null) {
      choices = it.choices.map(String); answer = choices[it.answerIndex];
    } else {
      answer = String(it.back ?? "").trim();
      if (!answer || answer.length > 80) return null;
      const wrong = shuffle(backs.filter(b => b !== answer && b.length <= 80)).slice(0, 3);
      if (wrong.length < 2) return null;
      choices = [answer, ...wrong];
    }
    return { q, choices: shuffle(choices), answer, explain: String(it.back ?? ""), hint: it.hint ? String(it.hint) : "", write: it.write === true };
  }).filter(Boolean);
}

// Lay out one scene: hiding spots spread over the width, some of them with an animal.
// How animals hide, per place in the journey: the first place is gentle, later ones get harder.
//   peek   – pops up now and then        eyes   – only two glinting eyes in a dark gap
//   clue   – never shows itself; leaves tracks, feathers or nutshells, rustles, or bubbles
//   runner – when found, runs off to another hiding place, leaving tracks
const STYLE_WEIGHTS = [
  { peek: .55, eyes: .25, clue: .2, runner: 0 },
  { peek: .35, eyes: .25, clue: .25, runner: .15 },
  { peek: .2, eyes: .25, clue: .3, runner: .25 },
];
function weighted(w) {
  let r = Math.random() * Object.values(w).reduce((a, b) => a + b, 0);
  for (const [k, v] of Object.entries(w)) { if ((r -= v) < 0) return k; }
  return Object.keys(w)[0];
}
// Somewhere 160–240 units away on the ground, for a trail of tracks to start from.
function trailStart(x, y) {
  const a = Math.random() * Math.PI * 2, d = 160 + Math.random() * 80;
  return { x: Math.round(clamp(x + Math.cos(a) * d, 60, GATE_X - 90)), y: Math.round(clamp(y + Math.sin(a) * d * .5, GROUND_TOP + 30, GROUND_BOTTOM)) };
}
function giveClue(sp) {
  if (sp.kind === "water") sp.clue = "bubbles";
  else if (TALL_KINDS.includes(sp.kind)) sp.clue = "items";
  else if (sp.kind === "reeds") sp.clue = "rustle";
  else {
    sp.clue = Math.random() < .55 ? "tracks" : "rustle";
    if (sp.clue === "tracks") sp.trackFrom = trailStart(sp.x, sp.y + 6);
  }
}

function buildScene(place, animals, si = 0, holiday = null) {
  const def = PLACES[place], H = HOLIDAYS[holiday];
  const seed = Math.floor(Math.random() * 100000);
  if (place === "castle") {
    return { place, seed, open: false, hero: { x: 840, y: 790 },
      spots: [{ kind: "boss", x: 1060, y: 790, animal: H ? H.boss : "dragon", found: true, answered: false, stars: 0, bossLeft: BOSS_QUESTIONS }] };
  }
  const spotList = H ? (place === "lake" ? H.spots.lake : H.spots.other) : def.spots;
  const count = animals + Math.max(3, animals + 1) + Math.min(si, 2);  // more empty spots further on
  const kinds = shuffle(Array.from({ length: count }, (_, i) => spotList[i % spotList.length]));
  const x0 = 230, x1 = GATE_X - 160, step = (x1 - x0) / (count - 1);
  const spots = kinds.map((kind, i) => {
    const x = x0 + i * step + (Math.random() - .5) * step * .5;
    let y;
    if (kind === "water") y = 470 + Math.random() * 90;           // out in the lake
    else if (kind === "reeds") y = 640 + Math.random() * 30;      // along the shore
    else if (TALL_KINDS.includes(kind)) y = 655 + Math.random() * 25;  // trees stand at the back
    else y = (i % 2 ? 690 : 760) + Math.random() * 70;
    return { kind, x: Math.round(x), y: Math.round(y), animal: null, found: false, answered: false, stars: 0 };
  });
  // Put animals in spots they like; don't use the same animal twice in a scene if avoidable.
  const used = new Set();
  shuffle(spots.map((_, i) => i)).slice(0, animals).forEach(i => {
    const options = hidersFor(spots[i].kind, holiday);
    const fresh = options.filter(a => !used.has(a));
    const a = pick(fresh.length ? fresh : options);
    used.add(a); spots[i].animal = a;
  });
  // How each animal hides. At most one runner per place, and only if it has somewhere to run to.
  const weights = STYLE_WEIGHTS[Math.min(si, STYLE_WEIGHTS.length - 1)];
  let runners = 0;
  spots.forEach(sp => {
    if (!sp.animal) return;
    let style = weighted(weights);
    if (style === "eyes" && !SPOT_KINDS[sp.kind].eyes) style = "clue";
    if (style === "runner" && (runners || WATER_KINDS.includes(sp.kind) || !runTarget(spots, sp, holiday))) style = "peek";
    if (style === "runner") runners++;
    sp.style = style;
    if (style === "clue") giveClue(sp);
  });
  // False clues further on: an empty bush that rustles, or tracks that lead to nothing.
  shuffle(spots.filter(sp => !sp.animal && !WATER_KINDS.includes(sp.kind) && !TALL_KINDS.includes(sp.kind)))
    .slice(0, Math.min(si, 2)).forEach(giveClue);
  return { place, seed, open: false, hero: { x: 110, y: 770 }, spots };
}

async function startJourney() {
  $("#goBtn").disabled = true;
  let pack;
  try {
    const r = await fetch(`/api/pack/${encodeURIComponent(setup.pack)}`);
    pack = await r.json();
  } catch { alert("Kunde inte ladda frågepaketet."); $("#goBtn").disabled = false; return; }
  const qs = shuffle(toQuestions(pack.items || []));
  if (qs.length < 3) { alert("Det här paketet har för få frågor för ett äventyr."); $("#goBtn").disabled = false; return; }

  const len = LENGTHS.find(l => l.scenes === setup.length) || LENGTHS[1];
  const holiday = theme().holiday;
  const scenes = ROUTES[len.scenes].map((p, si) => buildScene(p, len.per, si, holiday));
  scenes.push(buildScene("castle", 0, 0, holiday));

  game = {
    pack: setup.pack, packTitle: setup.packTitle || pack.title || setup.pack,
    hero: setup.hero, name: setup.name, scenes, si: 0, stars: 0, len: len.scenes, holiday,
    points: 0, streak: 0, bestStreak: 0, firstTry: 0,
    questions: qs, qi: 0, writeQs: qs.filter(q => q.write), finished: false, startedAt: Date.now(),
  };

// The client's own guess, until the server answers (or if it can't).
function clockTheme() {
  const d = new Date(), m = d.getMonth() + 1, day = d.getDate(), h = d.getHours();
  return { season: m === 12 || m <= 2 ? "winter" : m <= 5 ? "spring" : m <= 8 ? "summer" : "autumn",

    holiday: (m === 10 && day >= 25) || (m === 11 && day <= 1) ? "halloween" : m === 12 && day <= 26 ? "christmas" : null };
}

  const preset = setup.theme && setup.theme !== "auto" ? THEME_PRESETS[setup.theme] : null;
  const t = preset || liveTheme || clockTheme();
  const holiday = game && "holiday" in game ? game.holiday : t.holiday || null;
  return {
    season: holiday === "christmas" ? "winter" : holiday === "halloween" ? "autumn" : t.season || "summer",
    timeOfDay: holiday === "halloween" ? "night" : t.timeOfDay || "day",
    weather: t.weather || "clear", holiday,

}

  const parts = [SEASON_WORD[t.season], WEATHER_WORD[t.weather], TIME_WORD[t.timeOfDay]];

}

    for (let k = 0; k < 18; k++) s += pine(k * 95 + rnd(seed + 50 + k) * 40, 640 - rnd(seed + 70 + k) * 30, .8 + rnd(seed + 90 + k) * .5, k % 2 ? "#2f7d4a" : "#3a8a55", true);
  }
  if (p === "lake") {
    for (let k = 0; k < 30; k++) s += spooky ? deadTree(k * 56 + rnd(seed + 50 + k) * 20, 384, .4) : pine(k * 56 + rnd(seed + 50 + k) * 20, 384, .45 + rnd(seed + 90 + k) * .25, k % 2 ? "#2f7d4a" : "#3a8a55", winter);
    s += `<rect x="0" y="380" width="${W}" height="260" fill="url(#wat)"/>`;
    for (let k = 0; k < (winter ? 10 : 26); k++) {
      const x = rnd(seed + 120 + k) * W, y = 400 + rnd(seed + 140 + k) * 210;
      s += winter ? `<path d="M${x - 30} ${y} l50 -6" stroke="#fff" stroke-width="2" opacity=".8"/>`
        : `<path d="M${x - 18} ${y} q9 -6 18 0 q9 6 18 0" stroke="#fff" stroke-width="2.5" fill="none" opacity=".7"/>`;
    }
    if (!winter) for (let k = 0; k < 6; k++) {
      const x = rnd(seed + 160 + k) * (GATE_X - 100), y = 430 + rnd(seed + 170 + k) * 150;
      s += `<g transform="translate(${x} ${y})"><ellipse rx="22" ry="9" fill="${T.season === "autumn" ? "#a8a843" : "#4fae5b"}"/><path d="M0 0 L22 -3 L19 5Z" fill="#5fb6dc"/>${k % 2 && T.season !== "autumn" ? `<circle cx="-6" cy="-5" r="5" fill="#ff9fc4"/>` : ""}</g>`;
    }
  }
  if (p === "castle") {
    s += `<path d="M0 560 Q300 480 640 540 T1300 520 T1600 540 V640 H0Z" fill="${T.holiday === "halloween" ? "#3a3150" : winter ? "#e3ecf4" : "#c6e7a8"}"/>`;
    if (!night && !["rain", "thunder"].includes(T.weather) && !T.holiday)
      ["#ff8a8a", "#ffc46b", "#fff07a", "#8fe08a", "#7ad7ff", "#b39bff"].forEach((c, k) =>
        s += `<path d="M${640 + k * 14} 640 A${440 - k * 14} ${360 - k * 14} 0 0 1 ${1520 - k * 14} 640" stroke="${c}" stroke-width="14" fill="none" opacity=".75"/>`);
    s += spooky ? draculaCastle(1080, 640) : T.holiday === "christmas" ? northPole(1040, 660) : castleSvg(1080, 640);
  }

  // the ground
  const groundTop = p === "lake" ? 625 : 600;
  s += `<path d="M0 ${groundTop} Q400 ${groundTop - 20} 800 ${groundTop} T1600 ${groundTop} V${H} H0Z" fill="url(#grd)"/>`;
  if (p === "lake") s += `<path d="M0 622 Q400 600 800 620 T1600 620 V640 Q800 650 0 640Z" fill="${winter ? "#eef3f8" : "#ead9a2"}"/>`;
  if (p === "castle") s += `<path d="M120 800 Q500 820 760 760 T1080 690" stroke="${winter ? "#dfe7ef" : "#e9d3a6"}" stroke-width="54" fill="none" stroke-linecap="round"/>`;
  // ground decorations, by season
  for (let k = 0; k < 40; k++) {
    const x = rnd(seed + 200 + k) * W, y = 650 + rnd(seed + 260 + k) * 240, r = rnd(seed + 320 + k);
    if (spooky) s += r < .5 ? tuft(x, y, "#2c3424") : r < .62 ? toadstool(x, y, .3 + r * .3, "#7b4fa8") : `<ellipse cx="${x}" cy="${y}" rx="6" ry="3" fill="${["#8a4a2a", "#5a3a2a"][k % 2]}" transform="rotate(${(r * 180).toFixed(0)} ${x} ${y})"/>`;
    else if (winter) s += `<ellipse cx="${x}" cy="${y}" rx="${10 + r * 14}" ry="${4 + r * 4}" fill="#fff"/><ellipse cx="${x + 3}" cy="${y + 3}" rx="${8 + r * 10}" ry="${2 + r * 2}" fill="#c9d8e6" opacity=".6"/>`;
    else if (p === "mountain") s += r < .5 ? tuft(x, y, "#7fa874") : `<ellipse cx="${x}" cy="${y}" rx="${8 + r * 10}" ry="${5 + r * 5}" fill="#b6bfc9"/>`;
    else if (p === "mushroom" && r < .25) s += toadstool(x, y, .4 + r, ["#e8433a", "#b36bff", "#ff8a3d"][k % 3]);
    else if (T.season === "autumn") s += r < .35 ? tuft(x, y, look.grass) : r < .5 ? toadstool(x, y, .3 + r * .3, k % 2 ? "#e8433a" : "#b07a3b")
      : `<ellipse cx="${x}" cy="${y}" rx="7" ry="3.5" fill="${["#e8533a", "#f0a43a", "#d9822f", "#c9a23a"][k % 4]}" transform="rotate(${(r * 180).toFixed(0)} ${x} ${y})"/>`;
    else s += r < (T.season === "spring" ? .35 : .55) ? tuft(x, y, look.grass) : flower(x, y, ["#ff8fb8", "#ffd447", "#fff", "#b48bff", "#7ad7ff"][k % 5]);
  }
  // larger decorations go only where they don't cover a hiding place
  if (spooky) {
    s += `<path d="M0 640 H1600" stroke="#1e1428" stroke-width="4"/>` + Array.from({ length: 40 }, (_, k) => `<path d="M${k * 40 + 10} 642 V610 l4 -8 l4 8 V642" fill="#1e1428"/>`).join("");
    placeFree(sc, seed + 900, 7).forEach((o, k) => { s += k === 0 ? `<g transform="translate(${o.x} ${o.y}) scale(.55)"><svg x="-50" y="-96" width="100" height="100" viewBox="0 0 100 100">${CHARACTERS.skeleton.draw("idle").replace(/#f4f1e8/g, "#cfcabb")}</svg></g>`
      : k < 3 ? smallTombstone(o.x, o.y) : pumpkin(o.x, o.y, .7 + rnd(seed + 920 + k) * .3); });
    for (let k = 0; k < 8; k++) s += `<ellipse cx="${rnd(seed + 960 + k) * W}" cy="${690 + rnd(seed + 970 + k) * 160}" rx="${120 + rnd(seed + 980 + k) * 120}" ry="14" fill="#cfc8e8" opacity=".12"/>`;
  } else if (T.holiday === "christmas") {
    // mostly candy canes and snowmen: small presents would look like the present-pile hiding places
    placeFree(sc, seed + 930, 6).forEach((o, k) => { s += k < 3 ? candyCane(o.x, o.y) : k < 5 ? snowman(o.x, o.y) : gift(o.x, o.y, "#e8433a"); });
  } else if (winter && p !== "castle") {
    placeFree(sc, seed + 950, 2).forEach(o => { s += snowman(o.x, o.y); });
  }
  if (p === "mushroom" || (night && T.season === "summer")) for (let k = 0; k < 14; k++)
    s += `<circle cx="${rnd(seed + 400 + k) * W}" cy="${300 + rnd(seed + 420 + k) * 500}" r="3" fill="#fff59a" class="pulse" style="animation-delay:${(rnd(seed + 440 + k) * 2).toFixed(2)}s"/>`;
  // butterflies on nice days
  if (!night && !winter && ["clear", "partly"].includes(T.weather)) for (let k = 0; k < 2; k++) {
    const x = 200 + rnd(seed + 500 + k) * 1000, y = 560 + rnd(seed + 510 + k) * 120;
    s += `<g class="flutter" style="animation-delay:-${k * 3}s"><g transform="translate(${x} ${y})"><ellipse cx="-6" cy="0" rx="7" ry="9" fill="#ff9fc4"/><ellipse cx="6" cy="0" rx="7" ry="9" fill="#ffd447"/><rect x="-1.5" y="-7" width="3" height="14" rx="1.5" fill="${INK}"/></g></g>`;
  }
  return s;
}

// Darkens the scene at night and tints it at dawn and dusk; the hero stays bright on top.
function shadeSvg() {
  const T = theme();
  const shade = T.holiday === "halloween" ? ["#120826", .22] : T.timeOfDay === "night" ? ["#0a1430", .38] : T.timeOfDay === "dusk" ? [T.holiday === "halloween" ? "#3b1d5c" : "#5b3f8e", .16]
    : T.timeOfDay === "dawn" ? ["#ff9d6b", .08] : T.weather === "thunder" ? ["#2c3442", .18] : null;
  return shade ? `<rect width="${W}" height="${H}" fill="${shade[0]}" opacity="${shade[1]}" pointer-events="none"/>` : "";
}

function castleSvg(x, y) {
  return `<g transform="translate(${x} ${y})">
    <rect x="-150" y="-170" width="300" height="180" fill="#e8d9ff"/>

    <rect x="-210" y="-260" width="80" height="270" fill="#d7c4ff"/><rect x="130" y="-260" width="80" height="270" fill="#d7c4ff"/>

}

// The thing blocking the way on: a stream (bridge appears) or a boulder (rolls away).
function gateSvg(sc) {
  const def = PLACES[sc.place];
  if (!def.gate) return "";
  let s = "";
  if (def.gate === "stream") {
    const top = sc.place === "lake" ? 625 : 600;
    s += `<path d="M${GATE_X - 30} ${top} C${GATE_X - 70} 700 ${GATE_X + 10} 780 ${GATE_X - 40} ${H} H${GATE_X + 60} C${GATE_X + 110} 780 ${GATE_X + 30} 700 ${GATE_X + 60} ${top}Z" fill="url(#wat)"/>`;
    for (let k = 0; k < 6; k++) s += `<path d="M${GATE_X - 10 + (k % 2) * 20} ${top + 30 + k * 45} q8 -5 16 0" stroke="#fff" stroke-width="2.5" fill="none" opacity=".8"/>`;
    if (sc.open) {
      s += `<g><rect x="${GATE_X - 90}" y="700" width="200" height="90" rx="10" fill="#a4703f"/>
        ${Array.from({ length: 9 }, (_, k) => `<rect x="${GATE_X - 86 + k * 22}" y="702" width="18" height="86" rx="3" fill="${k % 2 ? "#c08a52" : "#b87f48"}"/>`).join("")}
        <path d="M${GATE_X - 90} 700 h200 M${GATE_X - 90} 790 h200" stroke="#7a5233" stroke-width="8" stroke-linecap="round"/>
        <path d="M${GATE_X - 80} 700 v-24 M${GATE_X + 100} 700 v-24 M${GATE_X - 80} 676 h180" stroke="#7a5233" stroke-width="6" stroke-linecap="round"/></g>`;
    }
  } else {
    const bx = sc.open ? GATE_X + 80 : GATE_X + 10, by = sc.open ? 640 : 830, r = sc.open ? .7 : 1;
    s += `<g transform="translate(${bx} ${by}) scale(${r})"><path d="M-110 0 Q-130 -120 -30 -170 Q80 -190 110 -80 Q130 0 90 0Z" fill="#8f99a6"/>
      <path d="M-60 -120 q30 -20 60 -10 M30 -60 q20 10 30 30" stroke="#aab3be" stroke-width="8" fill="none" stroke-linecap="round"/>
      <ellipse cx="-20" cy="-150" rx="30" ry="10" fill="#fff" opacity=".9"/></g>`;
  }
  // signpost to the next place
  const nextPlace = game.scenes[game.si + 1]?.place, next = nextPlace ? placeName(nextPlace) : "";
  s += `<g class="exit ${sc.open ? "pulse" : ""}" style="cursor:pointer">
    <rect x="1530" y="650" width="10" height="110" fill="#7a5233"/>
    <path d="M1478 640 h96 l20 22 l-20 22 h-96z" fill="${sc.open ? "#ffd447" : "#d8cbb4"}" stroke="#7a5233" stroke-width="3"/>
    <text x="1530" y="668" text-anchor="middle" font-size="16" font-weight="bold" fill="${INK}">${sc.open ? esc(next.slice(0, 11)) : "🔒"}</text></g>`;
  return s;
}

// One hiding spot: the object, the animal peeking out of it, and what it says once answered.
function spotSvg(sp, i) {
  const sid = `${game.si}-${i}`, x = sp.x, y = sp.y;
  if (sp.kind === "boss") {
    const done = sp.answered;
    return `<g class="spot" data-i="${i}">
      <rect x="${x - 90}" y="${y - 170}" width="180" height="180" fill="transparent" pointer-events="all"/>
      <g class="${done ? "" : "bob"}"><svg x="${x - 80}" y="${y - 160}" width="160" height="160" viewBox="0 0 100 100">${CHARACTERS[sp.animal].draw(done ? "happy" : "idle")}</svg></g>
      ${done ? "" : `<g class="pulse"><circle cx="${x + 60}" cy="${y - 150}" r="20" fill="#ffd447" stroke="#fff" stroke-width="4"/><text x="${x + 60}" y="${y - 141}" text-anchor="middle" font-size="26" font-weight="bold" fill="${INK}">!</text></g>`}
    </g>`;
  }
  const k = SPOT_KINDS[sp.kind];
  const [bw, bh] = k.box;
  const objects = spotObject(sp.kind, x, y, sid);
  let peeker = "", clip = "";
  const style = sp.style || "peek";
  if (sp.animal) {
    const st = sp.found ? "out" : style === "peek" || style === "runner" ? `hiding${game.si === 0 ? " easy" : ""}` : "still";
    const dur = (game.si === 0 ? 6 + rnd(sp.x) * 3 : 9 + rnd(sp.x) * 5).toFixed(2), delay = (-rnd(sp.y) * 8).toFixed(2);
    const mood = sp.answered ? "happy" : "idle";
    const inner = `<g class="peeker ${st}" style="--hide:${k.hide}px;--pk:${k.peek}px;--out:${k.out}px;animation-duration:${dur}s;animation-delay:${delay}s">
      <svg x="${x - k.size / 2}" y="${y + k.restTop}" width="${k.size}" height="${k.size}" viewBox="0 0 100 100">${CHARACTERS[sp.animal].draw(mood)}</svg></g>`;
    if (!sp.found) {
      clip = k.clipEllipse
        ? `<clipPath id="c${sid}"><ellipse cx="${x + k.clipEllipse[0]}" cy="${y + k.clipEllipse[1]}" rx="${k.clipEllipse[2]}" ry="${k.clipEllipse[3]}"/></clipPath>`
        : `<clipPath id="c${sid}"><rect x="${x - 200}" y="${y - 600}" width="400" height="${600 + k.clipY}"/></clipPath>`;
      peeker = `<g class="peek-wrap" clip-path="url(#c${sid})">${inner}</g>`;
    } else peeker = `<g class="peek-wrap">${inner}</g>`;
  }
  const topY = y + k.restTop + k.out;
  const badge = sp.answered
    ? `<text x="${x}" y="${topY - 6}" text-anchor="middle" font-size="22">${"⭐".repeat(sp.stars)}</text>`
    : sp.found ? `<g class="pulse"><circle cx="${x + k.size / 2}" cy="${topY + 4}" r="15" fill="#ffd447" stroke="#fff" stroke-width="3"/><text x="${x + k.size / 2}" y="${topY + 11}" text-anchor="middle" font-size="19" font-weight="bold" fill="${INK}">?</text></g>` : "";
  const hidden = !sp.found;
  const clue = hidden ? sp.clue : null;  // also set on some empty spots, as false clues
  const bubbles = clue === "bubbles"
    ? [0, 1, 2].map(b => `<circle cx="${x - 10 + b * 10}" cy="${y - 4}" r="${3 + b}" fill="#fff" opacity=".8" class="bubble-up" style="animation-delay:${b * 0.9 + rnd(sp.x + b) * 2}s"/>`).join("") : "";
  const items = clue === "items" ? clueItems(sp.animal === "squirrel" ? "nuts" : "feathers", x + 40, y + 6) : "";
  const eyesSvg = hidden && sp.animal && style === "eyes" ? glintEyes(x + k.eyes[0], y + k.eyes[1], sp) : "";
  const rustle = clue === "rustle" ? ` rustle" style="animation-delay:-${(rnd(sp.x + 7) * 8).toFixed(2)}s;animation-duration:${(7 + rnd(sp.y) * 4).toFixed(2)}s` : "";
  // a found animal stands in front of its hiding place; a hidden one behind it
  return `<g class="spot" data-i="${i}">${clip ? `<defs>${clip}</defs>` : ""}
    <rect x="${x - bw / 2}" y="${y - bh}" width="${bw}" height="${bh + 14}" fill="transparent" pointer-events="all"/>
    ${objects.back}${sp.found ? "" : peeker}<g class="front${rustle}">${objects.front}</g>${eyesSvg}${sp.found ? peeker : ""}${bubbles}${items}${badge}</g>`;
}

// Two eyes that blink in a dark gap now and then.
function glintEyes(ex, ey, sp) {
  const eye = dx => `<ellipse cx="${ex + dx}" cy="${ey}" rx="3.4" ry="4" fill="#fff6a8"/><circle cx="${ex + dx + .6}" cy="${ey + .4}" r="1.8" fill="${INK}"/>`;
  return `<g class="glint" style="animation-delay:-${(rnd(sp.x + 3) * 8).toFixed(2)}s;animation-duration:${(7 + rnd(sp.y + 3) * 4).toFixed(2)}s">${eye(-6)}${eye(6)}</g>`;
}

// Feathers or nutshells under a tree: someone is up there.
function clueItems(type, x, y) {
  if (type === "nuts") return [[0, 0], [14, 4], [-8, 6]].map(([dx, dy]) =>
    `<path d="M${x + dx - 5} ${y + dy} a5 5 0 0 1 10 0z" fill="#9a6640"/>`).join("");
  return [[0, 0, 20], [16, 5, -30]].map(([dx, dy, rot]) =>
    `<g transform="translate(${x + dx} ${y + dy}) rotate(${rot})"><path d="M-9 0 Q0 -6 9 0 Q0 4 -9 0z" fill="#f2efe6" stroke="#c9c2b0"/><path d="M-10 0 H10" stroke="#a8a090" stroke-width="1"/></g>`).join("");
}

// Trails of footprints: to an animal that leaves tracks or ran away, and some false ones.
function tracksSvg(sc) {
  let s = "";
  sc.spots.forEach(sp => {
    if (!sp.trackFrom || sp.found) return;
    const bird = sp.animal === "duck";
    const tx = sp.x, ty = sp.y + 6, fx = sp.trackFrom.x, fy = sp.trackFrom.y;
    const len = Math.hypot(tx - fx, ty - fy), ang = Math.atan2(ty - fy, tx - fx), steps = Math.floor((len - 60) / 30);
    for (let n = 0; n <= steps; n++) {
      const d = n * 30, side = n % 2 ? 7 : -7;
      const px = fx + Math.cos(ang) * d - Math.sin(ang) * side, py = fy + Math.sin(ang) * d + Math.cos(ang) * side;
      const rot = (ang * 180 / Math.PI + 90).toFixed(0);
      s += bird
        ? `<path transform="translate(${px.toFixed(1)} ${py.toFixed(1)}) rotate(${rot})" d="M0 4 V-4 M0 0 L-4 -5 M0 0 L4 -5" stroke="#5b4632" stroke-width="2" fill="none" opacity=".5"/>`
        : `<g transform="translate(${px.toFixed(1)} ${py.toFixed(1)}) rotate(${rot})" fill="#5b4632" opacity=".45"><ellipse cy="1.5" rx="3.6" ry="3"/><circle cx="-3.6" cy="-3" r="1.5"/><circle cy="-4.4" r="1.5"/><circle cx="3.6" cy="-3" r="1.5"/></g>`;
    }
  });
  return s;
}

let scale = 1;
function renderScene() {
  const sc = scene();
  // draw spots back to front so nearer things overlap farther ones
  const order = sc.spots.map((s, i) => i).sort((a, b) => sc.spots[a].y - sc.spots[b].y);
  const h = sc.hero;
  $("#world").innerHTML = `<svg id="scene" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    ${background(sc)}${gateSvg(sc)}
    <g id="tracks">${tracksSvg(sc)}</g>
    <g id="spots">${order.map(i => spotSvg(sc.spots[i], i)).join("")}</g>
    ${shadeSvg()}
    <g id="fx"></g>
    <g id="hero" transform="translate(${h.x} ${h.y})"><g id="heroFlip">
      <ellipse cx="0" cy="-4" rx="30" ry="7" fill="#000" opacity=".15"/>
      <svg x="${-HERO_SIZE / 2}" y="${-HERO_SIZE}" width="${HERO_SIZE}" height="${HERO_SIZE}" viewBox="0 0 100 100">${HEROES[game.hero].draw("idle")}</svg></g></g>
  </svg>`;
  fitScene();
  updateHud();
}

function fitScene() {
  const svg = $("#scene"); if (!svg) return;
  // show about 620 units of height, so the screen is mostly ground (where the animals are), not sky
  scale = Math.max(innerHeight / VIEW_H, innerWidth / W);
  svg.style.width = W * scale + "px";
  svg.style.height = H * scale + "px";
}

function camera(x, y, smooth) {
  $("#world").scrollTo({ left: x * scale - innerWidth / 2, top: y * scale - innerHeight * 0.66, behavior: smooth ? "smooth" : "auto" });
}

function updateHud() {
  const sc = scene();
  const as = animalSpots(sc), found = as.filter(s => s.answered).length;
  $("#where").innerHTML = sc.place === "castle" ? `${hol() ? hol().icon : "🏰"} <span class="place">${placeName("castle")}</span>` : `<span class="place">${placeName(sc.place)} · </span>🐾 ${found}/${as.length}`;
  $("#starCount").textContent = `🏆 ${game.points || 0}${game.streak >= 2 ? ` · 🔥${game.streak}` : ""}`;
  $("#soundBtn").textContent = sound ? "🔊" : "🔇";
  $("#hintSpotBtn").style.display = sc.place === "castle" ? "none" : "";
}

function banner(title, sub) {
  $("#bannerTitle").textContent = title; $("#bannerSub").textContent = sub;
  const b = $("#banner"); b.classList.remove("on"); void b.offsetWidth; b.classList.add("on");
}

function enterScene(fresh) {
  show("play");
  renderScene();
  startWeather();
  const sc = scene(), as = animalSpots(sc);
  const look = sc.place === "castle" ? { x: (sc.hero.x + sc.spots[0].x) / 2, y: sc.hero.y } : sc.hero;
  requestAnimationFrame(() => camera(look.x, look.y, false));
  if (sc.place === "castle") banner(placeName("castle"), hol() ? hol().waiting : "Draken Doris väntar vid slottet!");
  else if (sc.open) banner(placeName(sc.place), "Bra jobbat! Gå vidare till nästa plats →");
  else banner(placeName(sc.place), `${as.length} ${hiderWord(as.length)} har gömt sig här. Kan du hitta dem?${game.si === 0 ? " Svep för att se dig omkring!" : ""}`);
  if (fresh) sfx.open();
}

/* =====================================================================
   Walking around
   ===================================================================== */
let walking = false;
function walkTo(tx, ty, done) {
  const sc = scene();
  ty = clamp(ty, GROUND_TOP + 30, GROUND_BOTTOM);
  tx = clamp(tx, 50, sc.open || !PLACES[sc.place].gate ? W - 40 : GATE_X - 70);
  const from = { ...sc.hero }, dist = Math.hypot(tx - from.x, ty - from.y);
  const hero = $("#hero"), flip = $("#heroFlip");
  if (Math.abs(tx - from.x) > 4) flip.setAttribute("transform", tx < from.x ? "scale(-1 1)" : "");
  if (dist < 6) { done && done(); return; }
  walking = true;
  const dur = Math.max(250, dist / 0.5), hops = Math.max(1, Math.round(dist / 70)), t0 = performance.now();
  (function frame(now) {
    const t = Math.min(1, (now - t0) / dur);
    const x = from.x + (tx - from.x) * t, y = from.y + (ty - from.y) * t;
    const hop = Math.abs(Math.sin(t * Math.PI * hops)) * 14;
    hero.setAttribute("transform", `translate(${x} ${y - hop})`);
    camera(x, y, false);
    if (t < 1) return requestAnimationFrame(frame);
    hero.setAttribute("transform", `translate(${x} ${y})`);
    sc.hero = { x: Math.round(x), y: Math.round(y) };
    walking = false; persist();
    done && done();
  })(t0);
}

function toScene(e) {
  const svg = $("#scene"), pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

// Drag with the mouse to look around (touch screens scroll by themselves).
let drag = null, dragged = false;
$("#world").addEventListener("pointerdown", e => {
  if (e.pointerType !== "mouse") return;
  const w = $("#world");
  drag = { x: e.clientX, y: e.clientY, l: w.scrollLeft, t: w.scrollTop }; dragged = false;
});
addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 6) dragged = true;
  if (dragged) { const w = $("#world"); w.scrollLeft = drag.l - dx; w.scrollTop = drag.t - dy; }
});
addEventListener("pointerup", () => { drag = null; });

$("#world").onclick = e => {
  if (dragged) { dragged = false; return; }
  if (walking || !$("#scene")) return;
  const sc = scene();
  const spotEl = e.target.closest(".spot");
  if (spotEl) {
    const i = +spotEl.dataset.i, sp = sc.spots[i];
    // stand next to the spot, on the side the hero comes from
    const side = sc.hero.x < sp.x ? -1 : 1;
    const standX = sp.x + side * (SPOT_KINDS[sp.kind]?.box[0] / 2 + 20 || 110);
    const standY = sp.kind === "water" || sp.kind === "reeds" || TALL_KINDS.includes(sp.kind) ? GROUND_TOP + 50 : sp.y + 6;
    return walkTo(standX, standY, () => {
      $("#heroFlip").setAttribute("transform", side < 0 ? "" : "scale(-1 1)");
      inspect(i);
    });
  }
  if (e.target.closest(".exit")) {
    if (!sc.open) return say("Hitta alla gömda djur först! 🔍", e.clientX, e.clientY);
    return walkTo(W - 60, 740, leaveScene);
  }
  const p = toScene(e);
  walkTo(p.x, p.y, () => { if (sc.open && sc.hero.x > GATE_X + 80) leaveScene(); });
};

// What happens when the hero reaches a spot.
function inspect(i) {
  const sc = scene(), sp = sc.spots[i];
  const el = document.querySelector(`.spot[data-i="${i}"]`);
  if (!sp.animal) {
    sfx.rustle();
    el.querySelector(".front")?.classList.remove("wiggle"); void el.getBoundingClientRect();
    el.querySelector(".front")?.classList.add("wiggle");
    const r = el.getBoundingClientRect();
    return say(pick(EMPTY[sp.kind] || ["Tomt här!"]), r.left + r.width / 2, r.top + 10);
  }
  if (sp.answered) {
    const r = el.getBoundingClientRect();
    return say(`${CHARACTERS[sp.animal].name}: Tack för hjälpen! 💛`, r.left + r.width / 2, r.top);
  }
  if (!sp.found) {
    // pop out of the hiding place, in front of it
    sp.found = true; persist();
    sfx.found();
    const wrap = el.querySelector(".peek-wrap"), pk = el.querySelector(".peeker");
    wrap.removeAttribute("clip-path");
    el.insertBefore(wrap, el.querySelector(".front").nextSibling);
    pk.classList.remove("hiding");
    pk.style.transform = "translateY(0)"; void pk.getBoundingClientRect(); pk.style.transform = "";
    pk.classList.add("out");
    const r = el.getBoundingClientRect();
    if (sp.style === "runner" && !sp.ran && runTarget(sc.spots, sp)) {
      say("Hihi! Ta mig om du kan! 💨", r.left + r.width / 2, r.top);
      return setTimeout(() => runAway(i), 900);
    }
    say("Hittad! 🎉", r.left + r.width / 2, r.top);
    return setTimeout(() => openStation(i), 650);
  }
  openStation(i);
}

// An empty land spot the animal likes, preferably not right next door.
function runTarget(spots, sp, holiday = game && game.holiday) {
  const ok = spots.filter(t => t !== sp && !t.animal && !WATER_KINDS.includes(t.kind) && hidersFor(t.kind, holiday).includes(sp.animal));
  ok.sort((a, b) => Math.abs(b.x - sp.x) - Math.abs(a.x - sp.x));
  return ok[0] || null;
}

// The runner dashes to another hiding place and hides there for real, leaving tracks behind.
function runAway(i) {
  const sc = scene(), sp = sc.spots[i], target = runTarget(sc.spots, sp);
  if (!target) return openStation(i);
  const k = SPOT_KINDS[sp.kind], size = 60, a = sp.animal;
  const from = { x: sp.x, y: sp.y + k.restTop + k.out + k.size - 4 }, to = { x: target.x, y: target.y };
  const el = document.querySelector(`.spot[data-i="${i}"] .peek-wrap`);
  if (el) el.style.display = "none";
  $("#fx").innerHTML = `<g id="runner"><svg x="${-size / 2}" y="${-size}" width="${size}" height="${size}" viewBox="0 0 100 100">${CHARACTERS[a].draw("happy")}</svg></g>`;
  const g = $("#runner"), t0 = performance.now(), dur = 1300;
  tone([700, 900, 1100], 0.06, "square", 0.05);
  (function frame(now) {
    const t = Math.min(1, (now - t0) / dur);
    const x = from.x + (to.x - from.x) * t, y = from.y + (to.y - from.y) * t - Math.abs(Math.sin(t * Math.PI * 6)) * 22;
    g.setAttribute("transform", `translate(${x} ${y})${to.x < from.x ? " scale(-1 1)" : ""}`);
    if (t < 1) return requestAnimationFrame(frame);
    Object.assign(target, { animal: a, style: "clue", clue: "tracks", trackFrom: { x: sp.x, y: sp.y + 6 }, ran: true, found: false });
    Object.assign(sp, { animal: null, style: null, clue: null, trackFrom: null, found: false });
    persist();
    $("#fx").innerHTML = "";
    renderScene();
    camera(sc.hero.x, sc.hero.y, false);
    say("Den sprang iväg! Följ spåren 🐾", innerWidth / 2, innerHeight / 3);
  })(t0);
}

// The 🔍 button: one hidden animal peeks out and sparkles for a moment.
$("#hintSpotBtn").onclick = () => {
  const sc = scene();
  const hidden = sc.spots.map((s, i) => [s, i]).filter(([s]) => s.animal && !s.found);
  if (!hidden.length) {
    const left = animalSpots(sc).some(s => !s.answered);
    return say(left ? "Du har hittat alla – nu ska de bara få sina svar!" : "Alla djur är hittade! Gå till skylten →", innerWidth / 2, innerHeight / 3);
  }
  if ((game.points || 0) >= HINT_COST) { game.points -= HINT_COST; persist(); updateHud(); say(`−${HINT_COST} poäng`, innerWidth - 120, 70, "#c07a00"); }
  const [sp, i] = pick(hidden);
  const el = document.querySelector(`.spot[data-i="${i}"]`), pk = el.querySelector(".peeker");
  pk.classList.add("peek-now");
  const k = SPOT_KINDS[sp.kind];
  $("#fx").innerHTML = [[-50, -60], [46, -80], [0, -120], [-30, -10], [40, -20]].map(([dx, dy], n) =>
    `<text x="${sp.x + dx}" y="${sp.y + dy + (k.restTop + 90) / 2}" font-size="30" class="sparkle" style="animation-delay:${n * .15}s">✨</text>`).join("");
  camera(sp.x, sp.y, true);
  tone([880, 1175], 0.1, "sine", 0.1);
  setTimeout(() => { pk.classList.remove("peek-now"); $("#fx").innerHTML = ""; }, 2600);
};

function openGate() {
  const sc = scene();
  sc.open = true; persist();
  sfx.open();
  renderScene();
  const msg = PLACES[sc.place].gate === "boulder" ? "Stenen rullade undan!" : "En bro dök upp över bäcken!";
  banner(msg, "Gå till skylten för att komma vidare →");
  camera(GATE_X, 740, true);
  confetti(1800);
}

function leaveScene() {
  $("#fade").classList.add("on");
  setTimeout(() => {
    game.si++; persist();
    enterScene(true);
    $("#fade").classList.remove("on");
  }, 500);
}

/* =====================================================================
   Question dialog
   ===================================================================== */
let cur = null; // { i, q, answered, mistakes, right }

function openStation(i) {
  cur = { i, mistakes: 0 };
  newQuestion(scene().spots[i]);
  sfx.pop();
  renderQuestion(true);
  $("#dlg").classList.add("on");
}

const canWrite = () => claudeOk && !game.writeOff && (game.writeQs || []).length > 0;
function newQuestion(sp) {
  cur.write = sp.kind === "boss" && sp.bossLeft === 1 && canWrite();
  cur.q = cur.write ? pick(game.writeQs) : nextQuestion();
  cur.tries = 0; cur.answered = false; cur.right = false; cur.t0 = Date.now();
}

function startTimer() {
  cur.window = speedWindow(cur.q);
  const bar = $("#dlgTimer");
  bar.style.transition = "none"; bar.style.width = "100%"; void bar.offsetWidth;
  bar.style.transition = `width ${cur.window}s linear`; bar.style.width = "0%";
}

function renderQuestion(first) {
  if (cur.write) return renderWrite(first);
  const sp = scene().spots[cur.i], c = CHARACTERS[sp.animal];
  $("#dlgWriteBox").style.display = "none"; $("#dlgTimerBox").style.display = "";
  $("#dlgWho").innerHTML = svgOf(c, "idle");
  $("#dlgName").textContent = c.name;
  const boss = sp.kind === "boss";
  const intro = boss
    ? (sp.bossLeft === BOSS_QUESTIONS ? (hol() ? hol().intro(BOSS_QUESTIONS) : `Rooaar! Jag vaktar slottet. Svara rätt på ${BOSS_QUESTIONS} frågor så släpper jag in dig! Fråga 1:`) : `Bra! Fråga ${BOSS_QUESTIONS - sp.bossLeft + 1} av ${BOSS_QUESTIONS}:`)
    : (first ? pick(GREETINGS) : "Okej, här kommer en ny fråga:");
  $("#dlgQ").innerHTML = `${esc(intro)}<br><b>${esc(cur.q.q)}</b>`;
  $("#dlgAns").innerHTML = cur.q.choices.map((ch, k) =>
    `<button class="ans" data-k="${k}"><span class="k">${"ABCDEF"[k] || k + 1}</span>${esc(ch)}</button>`).join("");
  $("#dlgFb").className = "feedback"; $("#dlgFb").innerHTML = "";
  $("#hintBtn").style.display = cur.q.hint ? "" : "none";
  $("#closeBtn").style.display = "";
  $("#nextBtn").style.display = "none";
  $("#dlgHearts").textContent = boss ? `${hol() ? hol().emoji : "🐉"} ` + "❤️".repeat(sp.bossLeft) : "";
  cur.t0 = Date.now();
  startTimer();
}

function renderWrite(first) {
  const sp = scene().spots[cur.i], c = CHARACTERS[sp.animal];
  $("#dlgWho").innerHTML = svgOf(c, "idle");
  $("#dlgName").textContent = c.name;
  const intro = cur.tries === 0
    ? "Sista frågan! Den här svarar du på med egna ord – jag läser och bedömer ditt svar:"
    : "Förbättra ditt svar och försök igen:";
  $("#dlgQ").innerHTML = `${esc(intro)}<br><b>${esc(cur.q.q)}</b>`;
  $("#dlgAns").innerHTML = "";
  $("#dlgTimerBox").style.display = "none";
  $("#dlgWriteBox").style.display = "block";
  const ta = $("#dlgWrite");
  if (cur.tries === 0) ta.value = "";
  ta.disabled = false; $("#sendWriteBtn").disabled = false; $("#sendWriteBtn").style.display = "";
  $("#sendWriteBtn").textContent = `Ge svaret till ${bossShort()} ${hol() ? hol().emoji : "🐉"}`;
  if (cur.tries === 0) { $("#dlgFb").className = "feedback"; $("#dlgFb").innerHTML = ""; }
  $("#hintBtn").style.display = cur.q.hint ? "" : "none";
  $("#closeBtn").style.display = "";
  $("#nextBtn").style.display = "none";
  $("#dlgHearts").textContent = `${hol() ? hol().emoji : "🐉"} ` + "❤️".repeat(sp.bossLeft);
  setTimeout(() => ta.focus(), 50);
}

// Points for a right answer, with the streak and speed bonus; returns the explanation line.
function award(withSpeed) {
  game.streak = (game.streak || 0) + 1;
  game.bestStreak = Math.max(game.bestStreak || 0, game.streak);
  const mult = streakMultiplier(game.streak);
  const bonus = withSpeed ? speedBonus(Date.now() - cur.t0, cur.window) : 0;
  const pts = BASE_POINTS * mult + bonus;
  game.points = (game.points || 0) + pts;
  updateHud();
  const parts = [`${BASE_POINTS}${mult > 1 ? ` × ${mult} (🔥 ${game.streak} i rad)` : ""}`];
  if (bonus) parts.push(`${bonus} ⚡ snabbt`);
  return { pts, line: `+${pts} poäng${parts.length > 1 || mult > 1 ? ` = ${parts.join(" + ")}` : ""}` };
}

$("#dlgAns").onclick = e => {
  const b = e.target.closest(".ans"); if (!b || cur.answered) return;
  const sp = scene().spots[cur.i], c = CHARACTERS[sp.animal], boss = sp.kind === "boss";
  const choice = cur.q.choices[+b.dataset.k];
  const right = choice === cur.q.answer;
  cur.answered = true; cur.right = right;
  const bar = $("#dlgTimer"); bar.style.transition = "none"; bar.style.width = getComputedStyle(bar).width;
  [...$("#dlgAns").children].forEach(x => { x.disabled = true; if (cur.q.choices[+x.dataset.k] === cur.q.answer) x.classList.add("right"); });
  track("adventure", { question: cur.q.q, userAnswer: choice, correctAnswer: cur.q.answer, isCorrect: right, timeTaken: Date.now() - cur.t0 });

  const fb = $("#dlgFb");
  const explain = cur.q.explain && cur.q.explain !== cur.q.answer ? `<br><small>${esc(cur.q.explain)}</small>` : "";
  if (right) {
    sfx.right();
    $("#dlgWho").innerHTML = svgOf(c, "happy");
    const { pts, line } = award(true);
    if (!boss && cur.mistakes === 0) game.firstTry = (game.firstTry || 0) + 1;
    fb.className = "feedback on good";
    fb.innerHTML = `<b>${pick(PRAISE)}</b>${explain}<span class="score-line">${esc(line)}</span>`;
    const r = b.getBoundingClientRect();
    say(`+${pts}`, r.left + r.width / 2, r.top, "#f0a400");
    if (boss && sp.bossLeft > 1) {
      sp.bossLeft--; game.stars++;
      $("#nextBtn").textContent = sp.bossLeft === 1 && canWrite() ? "Sista frågan ✏️ →" : "Nästa fråga →";
    } else {
      if (boss) sp.bossLeft = 0;
      // 3 stars on the first try, 2 after one miss, 1 after more
      sp.stars = boss ? 3 : Math.max(1, 3 - cur.mistakes);
      game.stars += boss ? 1 : sp.stars;
      $("#nextBtn").textContent = boss ? "In i slottet! 🏰" : "Tack! →";
    }
  } else {
    sfx.wrong();
    cur.mistakes++;
    game.streak = 0; updateHud();
    b.classList.add("wrong");
    $("#dlgWho").innerHTML = svgOf(c, "sad");
    fb.className = "feedback bad on";
    fb.innerHTML = `${pick(COMFORT)} <b>${esc(cur.q.answer)}</b>${explain}<br>Du får en ny fråga – försök igen!`;
    $("#nextBtn").textContent = "Ny fråga →";
  }
  $("#closeBtn").style.display = "none";
  $("#hintBtn").style.display = "none";
  $("#nextBtn").style.display = "";
  persist();
};

$("#nextBtn").onclick = () => {
  const sc = scene(), sp = sc.spots[cur.i];
  if (!cur.right || (sp.kind === "boss" && sp.bossLeft > 0)) {
    if (cur.write && !cur.right && cur.tries < WRITE_MAX_TRIES && canWrite()) { cur.answered = false; return renderWrite(false); }
    newQuestion(sp);
    return renderQuestion(false);
  }
  $("#dlg").classList.remove("on");
  sp.answered = true; persist();
  if (sp.kind === "boss") return finish();
  renderScene();
  if (animalSpots(sc).every(s => s.answered)) setTimeout(openGate, 400);
  else {
    const left = animalSpots(sc).filter(s => !s.answered).length;
    say(`${left === 1 ? "Ett" : left} ${hiderWord(left)} kvar att hitta!`, innerWidth / 2, innerHeight / 3);
  }
};

$("#sendWriteBtn").onclick = async () => {
  const ans = $("#dlgWrite").value.trim();
  if (!ans) { say("Skriv ett svar först ✏️", innerWidth / 2, innerHeight / 3); return; }
  const sp = scene().spots[cur.i], c = CHARACTERS[sp.animal], fb = $("#dlgFb");
  $("#dlgWrite").disabled = true; $("#sendWriteBtn").disabled = true; $("#sendWriteBtn").textContent = `${bossShort()[0].toUpperCase() + bossShort().slice(1)} läser … 📖`;
  $("#closeBtn").style.display = "none"; $("#hintBtn").style.display = "none";
  let r;
  try {
    const resp = await fetch("/api/review", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ system: REVIEW_SYSTEM, user: {
        question: cur.q.q, reference_answer: cur.q.explain || cur.q.answer, student_answer: ans, pack_title: game.packTitle,
        style_expectations: "Eleven är ett barn. Ett kort, korrekt svar med egna ord räcker. Var uppmuntrande och skriv feedback på enkel svenska som ett barn förstår."
      } }),
    });
    if (!resp.ok) throw new Error(await resp.text());
    r = (await resp.json()).review;
    if (!r || !Number.isFinite(Number(r.overall_score))) throw new Error("no score");
  } catch (e) {
    console.error(e);
    game.writeOff = true; cur.write = false; cur.right = false; cur.answered = true; persist();
    $("#sendWriteBtn").style.display = "none";
    fb.className = "feedback on bad";
    fb.innerHTML = "Oj, draken kunde inte läsa svaret just nu. Du får en vanlig fråga i stället.";
    $("#nextBtn").textContent = "Vanlig fråga →"; $("#nextBtn").style.display = "";
    return;
  }
  const score = clamp(Math.round(Number(r.overall_score)), 0, 3);
  const pass = score >= WRITE_PASS_SCORE;
  cur.answered = true; cur.right = pass; cur.tries++;
  track("adventure", { question: cur.q.q, userAnswer: ans, correctAnswer: cur.q.explain, isCorrect: pass, timeTaken: Date.now() - cur.t0 });
  $("#sendWriteBtn").style.display = "none";
  const grade = `Betyg: ${"⭐".repeat(score)}${"☆".repeat(3 - score)} (${score} av 3)`;
  const missing = (r.missing_points || []).filter(Boolean);
  if (pass) {
    sfx.right();
    $("#dlgWho").innerHTML = svgOf(c, "happy");
    const pts = 20 + 10 * score;
    game.points = (game.points || 0) + pts;
    game.streak++; game.bestStreak = Math.max(game.bestStreak || 0, game.streak); updateHud();
    sp.bossLeft = 0; sp.stars = 3; game.stars++;
    fb.className = "feedback on good";
    fb.innerHTML = `<b>${esc(grade)} – godkänt!</b><br>${esc(r.summary_feedback || "")}<span class="score-line">+${pts} poäng för ett skrivet svar</span>`;
    say(`+${pts}`, innerWidth / 2, innerHeight / 3, "#f0a400");
    $("#nextBtn").textContent = "In i slottet! 🏰";
  } else {
    sfx.wrong();
    $("#dlgWho").innerHTML = svgOf(c, "sad");
    game.streak = 0; updateHud();
    const last = cur.tries >= WRITE_MAX_TRIES;
    fb.className = "feedback on bad";
    fb.innerHTML = `<b>${esc(grade)} – nästan!</b><br>${esc(r.summary_feedback || "")}` +
      (missing.length ? `<br><small>Tänk på: ${esc(missing.join("; "))}</small>` : "") +
      (last ? `<br><small>Ett bra svar hade varit: ${esc(r.suggested_answer || cur.q.explain)}</small>` : "");
    $("#nextBtn").textContent = last ? "Ny fråga →" : "Förbättra svaret ✏️";
  }
  $("#nextBtn").style.display = "";
  persist();
};

// The same instructions Test Prep's Write & Review sends, calibrated to the grade in the pack title.
const REVIEW_SYSTEM = [
  "Du är en vänlig svensk lärare som bedömer ett barns svar i ett lärospel.",
  "Bedöm elevens svar baserat på frågan, referenssvaret och paketets titel, som ofta anger årskurs (t.ex. 'åk 4').",
  "Kräv INTE en lång motivering: om frågan har ett kort, entydigt svar räcker ett korrekt och tydligt kort svar.",
  "Om frågan kräver förklaring eller resonemang, förvänta en förklaring på den nivå som årskursen rimligen klarar.",
  "Bedöm innehållet, inte stavning eller grammatik, så länge svaret går att förstå.",
  "Svara ENDAST med JSON enligt: {correctness_score:int, clarity_score:int, completeness_score:int, technical_accuracy_score:int, overall_score:int, summary_feedback:string, missing_points:string[], technical_notes:string, clarity_notes:string, suggested_answer:string}",
  "Alla score-fält: 0-3 (0=bristfälligt, 1=godkänt, 2=bra, 3=utmärkt).",
  "summary_feedback: en eller två korta, uppmuntrande meningar till barnet, på enkel svenska.",
  "missing_points: högst två korta saker som saknas, på enkel svenska.",
  "suggested_answer: ett kort exempel på ett bra svar på barnets nivå.",
].join(" ");

$("#closeBtn").onclick = () => { $("#dlg").classList.remove("on"); renderScene(); };
$("#hintBtn").onclick = () => {
  const fb = $("#dlgFb");
  fb.className = "feedback on hint";
  fb.innerHTML = `💡 ${esc(cur.q.hint)}`;
  $("#hintBtn").style.display = "none";
};

/* =====================================================================
   Finish
   ===================================================================== */
function finish() {
  game.finished = true;
  const animals = game.scenes.reduce((n, sc) => n + animalSpots(sc).length, 0);
  // Records per pack and length, so a game is compared with the same kind of game.
  const key = `${game.pack}|${game.len || game.scenes.length - 1}`;
  saved.records = saved.records || {}; saved.bestByPack = saved.bestByPack || {};
  const prev = saved.records[key], pts = game.points || 0, record = prev == null || pts > prev;
  if (record) saved.records[key] = pts;
  saved.bestByPack[game.pack] = Math.max(saved.bestByPack[game.pack] || 0, pts);
  persist();
  track("session", { action: "finish", duration: Date.now() - game.startedAt });
  sfx.win();
  show("finish");
  $("#finishArt").innerHTML = `<svg viewBox="0 0 220 120" width="300" height="160">
    <g transform="translate(0 10)"><svg width="110" height="110" viewBox="0 0 100 100">${HEROES[game.hero].draw("happy")}</svg></g>
    <g transform="translate(110 10)"><svg width="110" height="110" viewBox="0 0 100 100">${CHARACTERS[hol() ? hol().boss : "dragon"].draw("happy")}</svg></g></svg>`;
  $("#finishStars").textContent = `🏆 ${pts} poäng`;
  const who = game.name ? `${esc(game.name)}, du` : "Du";
  const recordLine = record
    ? (prev == null ? "Ditt första rekord på den här banan! 🎉" : `<b>Nytt rekord! 🎉</b> Förra rekordet var ${prev} poäng.`)
    : `Ditt rekord är ${prev} poäng – kan du slå det nästa gång?`;
  $("#finishText").innerHTML = `${who} hittade alla ${animals} gömda ${hiderWord(animals)} och tog dig hela vägen till ${esc(placeName("castle"))} i<br><i>${esc(game.packTitle)}</i>!<br><br>
    ${recordLine}<br><small>Längsta svit: 🔥 ${game.bestStreak || 0} i rad · Rätt på första försöket: ${game.firstTry || 0} av ${animals}</small><br><br>${hol() ? hol().finish : "Draken Doris bjuder på tårta. 🎂"}`;
  confetti(4500);
}
$("#againBtn").onclick = () => { saved.game = null; game = null; persist(); show("start"); renderStart(); };

/* =====================================================================
   Weather layer: particles over the scene (rain, snow, falling leaves), thunder flashes and fog
   ===================================================================== */
let wxTimer = null;
function startWeather() {
  const T = theme(), cv = $("#wx"), ctx = cv.getContext("2d");
  cancelAnimationFrame(wxTimer);
  const kind = ["rain", "thunder"].includes(T.weather) ? "rain" : T.weather === "snow" ? "snow" : T.season === "autumn" && !T.holiday ? "leaves" : null;
  $("#fog").style.display = T.weather === "fog" && $("#play").classList.contains("on") ? "block" : "none";
  if (!kind || !$("#play").classList.contains("on")) { cv.style.display = "none"; return; }
  cv.style.display = "block"; cv.width = innerWidth; cv.height = innerHeight;
  const n = kind === "rain" ? 140 : kind === "snow" ? 110 : 14;
  const parts = Array.from({ length: n }, () => ({ x: Math.random() * cv.width, y: Math.random() * cv.height, v: .6 + Math.random() * .8, a: Math.random() * 6 }));
  const leafColors = ["#e8533a", "#f0a43a", "#d9822f", "#c9a23a"];
  let flash = 0, nextFlash = performance.now() + 4000 + Math.random() * 6000;
  (function frame(now) {
    if (!$("#play").classList.contains("on")) { cv.style.display = "none"; $("#fog").style.display = "none"; return; }
    ctx.clearRect(0, 0, cv.width, cv.height);
    parts.forEach((p, i) => {
      if (kind === "rain") { p.x -= 2 * p.v; p.y += 14 * p.v; ctx.strokeStyle = "rgba(200,220,255,.55)"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - 3, p.y + 12); ctx.stroke(); }
      else if (kind === "snow") { p.a += .02; p.x += Math.sin(p.a) * .6; p.y += 1.2 * p.v; ctx.fillStyle = "rgba(255,255,255,.9)"; ctx.beginPath(); ctx.arc(p.x, p.y, 1.5 + p.v * 2, 0, 7); ctx.fill(); }
      else { p.a += .03; p.x += Math.sin(p.a) * 1.4 - .4; p.y += .9 * p.v; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = leafColors[i % 4]; ctx.beginPath(); ctx.ellipse(0, 0, 7, 3.5, 0, 0, 7); ctx.fill(); ctx.restore(); }
      if (p.y > cv.height + 10) { p.y = -12; p.x = Math.random() * (cv.width + 60); }
      if (p.x < -20) p.x = cv.width + 10;
    });
    if (T.weather === "thunder") {
      if (now > nextFlash) { flash = 1; nextFlash = now + 6000 + Math.random() * 8000; }
      if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${(flash * .7).toFixed(2)})`; ctx.fillRect(0, 0, cv.width, cv.height); flash -= .06; }
    }
    wxTimer = requestAnimationFrame(frame);
  })(performance.now());
}

/* =====================================================================
   Effects & helpers
   ===================================================================== */
function say(txt, x, y, color = INK) {
  const el = document.createElement("div");
  el.className = "float"; el.textContent = txt;
  el.style.left = clamp(x, 120, innerWidth - 120) + "px"; el.style.top = clamp(y, 80, innerHeight - 60) + "px";
  el.style.color = color; el.style.fontSize = txt.length > 12 ? "21px" : "30px";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1900);
}

function confetti(ms) {
  const cv = $("#confetti"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ["#ff8fb8", "#ffd447", "#7b6cff", "#3fbf6b", "#7ad7ff"];
  const bits = Array.from({ length: 150 }, () => ({
    x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * 0.5,
    vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 3, r: 4 + Math.random() * 5,
    a: Math.random() * 6, va: (Math.random() - .5) * .3, c: pick(colors),
  }));
  const t0 = performance.now();
  (function frame(now) {
    ctx.clearRect(0, 0, cv.width, cv.height);
    bits.forEach(b => { b.x += b.vx; b.y += b.vy; b.a += b.va;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.a); ctx.fillStyle = b.c; ctx.fillRect(-b.r, -b.r / 2, b.r * 2, b.r); ctx.restore(); });
    if (now - t0 < ms) requestAnimationFrame(frame); else ctx.clearRect(0, 0, cv.width, cv.height);
  })(t0);
}

function show(id) { document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); }

function track(type, data) {
  if (!game) return;
  fetch("/api/track", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ type, packId: game.pack, data }) }).catch(() => {});
}

$("#homeBtn").onclick = () => { $("#dlg").classList.remove("on"); show("start"); renderStart(); };
$("#soundBtn").onclick = () => { sound = !sound; persist(); updateHud(); sfx.pop(); };
addEventListener("resize", () => { if ($("#play").classList.contains("on") && game) { fitScene(); camera(scene().hero.x, scene().hero.y, false); startWeather(); } });
addEventListener("keydown", e => {
  if (!$("#dlg").classList.contains("on") || e.target.tagName === "TEXTAREA") return;
  const k = "abcd1234".indexOf(e.key.toLowerCase());
  if (k >= 0) { const btn = $("#dlgAns").children[k % 4]; if (btn && !btn.disabled) btn.click(); }
  else if (e.key === "Enter" && $("#nextBtn").style.display !== "none") $("#nextBtn").click();
  else if (e.key === "Escape" && !cur.answered) $("#closeBtn").click();
});

renderStart();
loadPacks();
fetch("/api/config").then(r => r.json()).then(c => { claudeOk = !!c.hasClaude; }).catch(() => {});
renderThemes();
loadTheme();
setInterval(loadTheme, 15 * 60 * 1000);
</script>
